[package]
name = "infinity-code"
version = "0.1.65"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "dialog-save", "fs-read-file", "dialog-open", "path-all", "fs-write-file", "fs-exists", "shell-open", "system-tray"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Frameless-window resize: WM_NCLBUTTONDOWN hit-test simulation (Windows only).
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
